{% extends "base.html" %}

{% block title %}{{ step.name }} — STRIKE RA{% endblock %}

{% block content %}
<main class="hero">
    <a class="back-link" href="{{ url_for('home') }}">&larr; Home</a>

    <div class="progress" aria-label="Progress">
        {% for s in steps %}
        <span class="pip {% if loop.index0 < index %}done{% elif loop.index0 == index %}current{% endif %}">{{ s.letter }}</span>
        {% endfor %}
    </div>

    <p class="step-count">Step {{ index + 1 }} of {{ total }} · {{ step.name }}</p>
    <h1 class="page-title">{{ step.prompt }}</h1>

    <form class="assessment-form" method="post" action="{{ url_for('assessment', step=index) }}">
        <textarea name="answer" rows="6" placeholder="Type your answer…" autofocus>{{ answer }}</textarea>
        <div class="form-actions">
            {% if index > 0 %}
            <button class="btn btn-ghost" type="submit" name="action" value="back">&larr; Back</button>
            {% endif %}
            <button class="btn btn-primary" type="submit" name="action" value="next">
                {% if is_last %}Finish &rarr;{% else %}Next &rarr;{% endif %}
            </button>
        </div>
    </form>
</main>
{% endblock %}
